# Mutations served by the riot graph at /graph.
#
# The executable schema is assembled in schema.go; this document is the
# contract it implements and is embedded into the binary by gql.go.

# SkillInput is the write shape for a skill. `id` is omitted (or null) when a
# new skill is being created; when present the record is updated in place.
# `dependencies` REPLACES the skill's dependency set: every id listed becomes a
# dependency of this skill, and every id not listed is detached.
# `references` REPLACES the skill's reference set the same way: the join rows
# are rewritten, and the Reference records themselves are never deleted.
# `projects` REPLACES the skill's project assignments the same way, keyed by
# project name. Omitting it leaves the assignments untouched.
input SkillInput {
	id: String
	name: String!
	description: String!
	url: String!
	content: String!
	keywords: String
	dependencies: [String!]
	references: [String!]
	projects: [String!]
}

# ReferenceInput is the write shape for a reference. `name` is the unique
# identity, so creating a reference whose name already exists is an error.
# `accessType` defaults to "static" when omitted.
input ReferenceInput {
	name: String!
	description: String!
	accessType: String
	resourceType: String!
	content: String
}

type Mutation {
	# SaveSkill creates or updates a skill and replaces its dependency and
	# reference sets. Returns the stored record, including its resolved
	# dependencies and references.
	SaveSkill(input: SkillInput!): Skill!

	# SaveReference creates a reference. Returns the stored record.
	SaveReference(input: ReferenceInput!): Reference!
}
